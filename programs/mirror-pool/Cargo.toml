[package]
name = "riverrun-program"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "On-chain Solana program for riverrun: commitment set, per-round nullifier anti-replay, and action settlement — the anti-replay and coordination layer of Tornado-for-behavior."

[lib]
crate-type = ["cdylib", "lib"]
name = "riverrun_program"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "1"
solana-sha256-hasher = "3"
# instruction introspection for the verifier attestation (audit-critical #2)
solana-instructions-sysvar = "3"
solana-sdk-ids = "3"

[dev-dependencies]
litesvm = "0.6"
solana-sdk = "2"
solana-client = "2"
sha2 = "0.10"
riverrun-sdk = { path = "../../crates/riverrun-sdk" }
riverrun-core = { path = "../../crates/riverrun-core" }
riverrun-trace = { path = "../../crates/riverrun-trace", features = ["onchain"] }
