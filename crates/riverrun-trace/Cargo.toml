[package]
name = "riverrun-trace"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The provenance-tracer: an adversarial on-chain de-anonymizer that measures how far a target's funding graph traces back to a labeled root — the axis every noise-based privacy tool leaves open."

[[bin]]
name = "riverrun"
path = "src/bin/riverrun.rs"
required-features = ["onchain"]

[features]
onchain = ["ureq", "serde_json"]

[dependencies]
blake3 = { workspace = true }
riverrun-core = { path = "../riverrun-core" }
ureq = { version = "2", features = ["json"], optional = true }
serde_json = { version = "1", optional = true }
