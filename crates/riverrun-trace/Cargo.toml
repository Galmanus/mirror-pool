[package]
name = "riverrun-trace"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The provenance-tracer: an adversarial on-chain de-anonymizer that measures how far a target's funding graph traces back to a labeled root — the axis every noise-based privacy tool leaves open."

[[bin]]
name = "provenance-tracer"
path = "src/main.rs"

# The on-chain adapter is an optional binary: it pulls real mainnet funding
# graphs over RPC. Kept out of the pure lib so `riverrun-trace` stays
# dependency-free and fully testable offline.
[[bin]]
name = "onchain-trace"
path = "src/bin/onchain.rs"
required-features = ["onchain"]

# Population mode: measure the funding-graph exposure of a real, live anonymity
# set rather than a single wallet.
[[bin]]
name = "pool-provenance"
path = "src/bin/poolscan.rs"
required-features = ["onchain"]

# The defensive dual: check one wallet's anonymity in a pool *before* it acts.
[[bin]]
name = "preflight"
path = "src/bin/preflight.rs"
required-features = ["onchain"]

[features]
onchain = ["ureq", "serde_json"]

[dependencies]
ureq = { version = "2", features = ["json"], optional = true }
serde_json = { version = "1", optional = true }
