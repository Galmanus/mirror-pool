[package]
name = "riverrun-m31"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "The post-quantum M31 Circle-STARK path for riverrun. Built on the official, MIT/Apache-2.0-licensed Plonky3 crates (field, Poseidon2 permutation, FRI, Circle PCS); one dependency (p3-util) carries a one-function, documented patch for Solana SBF toolchain compatibility, see vendor/p3-util-0.6.2-sbf-patch/PATCH.md; no other vendored or unlicensed code."

[dependencies]
p3-air = "0.6.2"
p3-field = "0.6.2"
p3-matrix = "0.6.2"
p3-mersenne-31 = { version = "0.6.2", default-features = false }
p3-poseidon2 = "0.6.2"
p3-poseidon2-air = "0.6.2"
p3-symmetric = "0.6.2"
p3-uni-stark = "0.6.2"
p3-circle = "0.6.2"
p3-commit = "0.6.2"
p3-fri = "0.6.2"
p3-challenger = "0.6.2"
p3-keccak = "0.6.2"
p3-merkle-tree = "0.6.2"
rand = { version = "0.9", default-features = false }
# bincode 1.x pulls serde with default features, i.e. serde/std. On a bare-wasm
# target (Soroban's wasm32v1-none) that makes serde_core drop its own #![no_std]
# and fail to find a standard library that does not exist there. It is only used
# for the proof wire format, so it lives behind a default-on feature that a
# bare-wasm build turns off (--no-default-features) and supplies its own
# serialization for.
bincode = { version = "1.3", optional = true }

[target.'cfg(target_os = "solana")'.dependencies]
# Only for the keccak256 syscall in src/keccak.rs; never linked off-chain.
solana-program = "2"

# Two SBF-toolchain-compatibility patches, documented in each PATCH.md. Not
# forks we intend to diverge on; remove them the moment Solana's SBF loader
# or platform-tools, or upstream Plonky3, close the respective gap.
[patch.crates-io]
p3-util = { path = "vendor/p3-util-0.6.2-sbf-patch" }
p3-mersenne-31 = { path = "vendor/p3-mersenne-31-0.6.2-sbf-patch" }
p3-uni-stark = { path = "vendor/p3-uni-stark-0.6.2-heap-patch" }
p3-circle = { path = "vendor/p3-circle-0.6.2-cutrace-patch" }

# Matches this repo's other Solana programs' release profile (contracts/receipt
# etc.): aggressive DCE/LTO, which SBF's link-time stack-frame check benefits
# from directly (unreferenced functions from dependencies riverrun-m31 doesn't
# actually call, e.g. p3-mersenne-31's Poseidon1/MDS code, should not survive
# to be checked at all).
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[features]
default = ["wire"]
# The bincode proof wire format. On by default; off for bare-wasm targets whose
# host provides its own serialization (see the bincode dependency's comment).
wire = ["dep:bincode"]
# Per-phase on-chain CU attribution via sol_log_compute_units in the vendored
# patches. Off by default: zero behavioral difference unless enabled.
cu-trace = ["p3-circle/cu-trace", "p3-uni-stark/cu-trace"]
