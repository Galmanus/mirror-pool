[workspace]
resolver = "2"
members = [
    "crates/riverrun-core",
    "crates/riverrun-eval",
    "crates/riverrun-trace",
]
# `crates/riverrun-stark` (post-quantum STARK membership, research/paper track) is
# intentionally excluded from the default workspace: it pulls the heavy Winterfell
# toolchain and is not on the critical path for the benchmark deliverable. It
# builds on its own when needed.
exclude = ["crates/riverrun-stark", "crates/riverrun-pool-zk", "programs/mirror-pool"]

# The on-chain Solana program and the round coordinator join the workspace as they
# land. riverrun-core is pure Rust and builds standalone so the cryptographic core
# can be developed and tested without the heavy Solana toolchain.

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/solanabr/mirror-pool"

[workspace.dependencies]
blake3 = "1.5"
thiserror = "1.0"
